services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influx:
    build:
      context: ../
      dockerfile: apps/influx/Dockerfile
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_ADDRESS}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3001
    networks:
      - default
      - dokploy-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: 168
    volumes:
      - geoip_data:/usr/share/GeoIP

  cinder:
    build:
      context: ../
      dockerfile: apps/cinder/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_ADDRESS}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_ADDRESS}:${CLICKHOUSE_PORT:-8123}/default
      GEOIP_DB_PATH: /var/lib/geoip/GeoLite2-Country.mmdb
    volumes:
      - geoip_data:/var/lib/geoip:ro
    networks:
      - default
      - dokploy-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ $(($(date +%s) - $(cat /tmp/cinder.health 2>/dev/null || echo 0))) -lt 30 ]",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dokploy-network:
    external: true

volumes:
  redis_data:
  geoip_data:
