name: bx-team
services:
  postgres:
    image: postgres:17-alpine
    container_name: bx-postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: bx_team
      POSTGRES_PASSWORD: bx_team
      POSTGRES_DB: bx_team
      PGUSER: bx_team
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bx_team']
      interval: 3s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    container_name: bx-clickhouse
    ports:
      - '127.0.0.1:8123:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: bx_team
      CLICKHOUSE_USER: bx_team
      CLICKHOUSE_PASSWORD: bx_team
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8123/ping']
      interval: 3s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bx-minio
    command: server /data --console-address ':9001'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: bx_team
      MINIO_ROOT_PASSWORD: bx_team_secret
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 5

  minio-buckets:
    image: minio/mc:latest
    container_name: bx-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 bx_team bx_team_secret
        mc mb --ignore-existing local/builds
        mc mb --ignore-existing local/error-payloads
        mc anonymous set download local/builds

  mail:
    image: axllent/mailpit:latest
    container_name: bx-mail
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/api/v1/info']
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
