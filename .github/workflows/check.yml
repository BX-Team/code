name: Check

on:
  workflow_call:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Type-check the workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Verify the lockfile is up to date
        run: cargo check --workspace --locked

  sqlx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bx_team
          POSTGRES_PASSWORD: bx_team
          POSTGRES_DB: bx_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx_team"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bx_team:bx_team@127.0.0.1:5432/bx_team
      SQLX_OFFLINE: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked

      - name: Apply migrations
        run: cargo sqlx migrate run --source packages/database/migrations

      - name: Verify the offline query cache matches the schema
        run: cargo sqlx prepare --workspace --check -- --all-targets

  commit-titles:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit titles are Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style)(\([[:alnum:]_.-]+\))?!?: .+'
          status=0
          while IFS= read -r title; do
            case "$title" in
              "Merge "*) continue ;;
            esac
            if ! printf '%s' "$title" | grep -Eq "$pattern"; then
              echo "::error::commit title is not a Conventional Commit: $title"
              status=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $status
        shell: bash
