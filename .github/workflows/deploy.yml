name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      bot: ${{ steps.filter.outputs.bot }}
      id: ${{ steps.filter.outputs.id }}
      skins: ${{ steps.filter.outputs.skins }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - bun.lock
              - packages/types/**
              - packages/worker/**
            api:
              - *shared
              - apps/api/**
            bot:
              - *shared
              - packages/projects/**
              - apps/bot/**
            id:
              - *shared
              - apps/id/**
            skins:
              - *shared
              - apps/skins/**
            web:
              - *shared
              - packages/**
              - apps/web/**

  worker:
    name: ${{ matrix.app }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, database: atlas-db }
          - { app: bot, database: "" }
          - { app: skins, database: skins-db }
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.bot == 'true' || needs.changes.outputs.skins == 'true' }}
    runs-on: ubuntu-latest
    concurrency: deploy-${{ matrix.app }}
    steps:
      - name: Changed
        id: run
        run: echo "go=${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.app] == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.run.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: steps.run.outputs.go == 'true'
      - if: steps.run.outputs.go == 'true'
        run: bun install --frozen-lockfile
      - name: Migrations
        if: steps.run.outputs.go == 'true' && matrix.database != ''
        working-directory: apps/${{ matrix.app }}
        run: bunx wrangler d1 migrations apply ${{ matrix.database }} --remote
      - name: Deploy
        if: steps.run.outputs.go == 'true'
        working-directory: apps/${{ matrix.app }}
        run: bunx wrangler deploy

  id:
    needs: [ changes, worker ]
    if: ${{ !cancelled() && needs.worker.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.id == 'true') }}
    runs-on: ubuntu-latest
    concurrency: deploy-id
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Migrations
        working-directory: apps/id
        run: bunx wrangler d1 migrations apply id-db --remote
      - name: Deploy
        working-directory: apps/id
        run: bunx wrangler deploy

  web:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate
        working-directory: apps/web
        run: bun run generate
      - name: Deploy
        working-directory: apps/web
        run: bunx wrangler deploy
