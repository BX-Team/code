name: Test and Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  format:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lints with Biome
        run: bunx biome ci .

      - name: Check spelling
        uses: crate-ci/typos@v1

  rust:
    name: Rust workspace
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace --all-features --locked

      - name: Run the test suite
        run: cargo test --workspace --all-features --locked

  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Build the static site
        run: bun run build:meridian

  summary:
    name: Report the build result
    if: always()
    needs: [format, rust, web]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the result to the run summary
        env:
          FORMAT: ${{ needs.format.result }}
          RUST: ${{ needs.rust.result }}
          WEB: ${{ needs.web.result }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🚫' ;;
              *) printf '⏭️' ;;
            esac
          }
          {
            echo "## Build of \`${GITHUB_SHA:0:7}\`"
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Formatting and spelling | $(icon "$FORMAT") \`$FORMAT\` |"
            echo "| Rust workspace | $(icon "$RUST") \`$RUST\` |"
            echo "| Web app | $(icon "$WEB") \`$WEB\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Fail if any stage did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
