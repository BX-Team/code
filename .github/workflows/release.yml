name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.2.0)
        required: true
        type: string
      draft:
        description: Publish the release as a draft
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io
  OWNER: bx-team

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and find the previous tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  format:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lints with Biome
        run: bunx biome ci .

      - name: Check spelling
        uses: crate-ci/typos@v1

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace --all-features --locked

      - name: Run the test suite
        run: cargo test --workspace --all-features --locked

  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Build the static site
        run: bun run build:meridian

  tag:
    name: Bump the version and tag
    needs: [prepare, format, rust, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set the workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          cargo update --workspace --offline
        shell: bash

      - name: Commit the bump and push the tag
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: Build ${{ matrix.service }}
    needs: [tag]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: rust:1.97-bookworm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [azimuth, influx, cinder]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ matrix.service }}

      - name: Build the service binary
        # Set on the service build only: stamping it globally would invalidate the cached
        # dependency crates on every commit.
        run: BX_GIT_HASH=$(git rev-parse --short HEAD) cargo build --profile release-service --locked -p ${{ matrix.service }}
        shell: bash

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.service }}
          path: target/release-service/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 1

  image:
    name: Push the ${{ matrix.service }} image
    needs: [prepare, tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [azimuth, influx, cinder]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.service }}
          path: apps/${{ matrix.service }}/staging

      - name: Make the binary executable
        run: chmod +x apps/${{ matrix.service }}/staging/${{ matrix.service }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:latest
          provenance: false

  publish:
    name: Publish the release
    needs: [prepare, tag, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog_configuration.json
          mode: COMMIT
          fromTag: ${{ needs.prepare.outputs.previous }}
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: ${{ inputs.draft }}

  summary:
    name: Report the release result
    if: always()
    needs: [prepare, format, rust, web, tag, build, image, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the result to the run summary
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if printf '%s' "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::release $TAG did not complete"
            exit 1
          fi
          {
            echo "## $TAG released"
            echo
            echo '| Image | Tags |'
            echo '| --- | --- |'
            for service in azimuth influx cinder; do
              echo "| \`ghcr.io/bx-team/$service\` | \`${TAG#v}\`, \`latest\` |"
            done
            echo
            echo 'The host picks the images up within 15 minutes via `podman-auto-update.timer`.'
            echo 'To roll it out now: `systemctl start podman-auto-update`.'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
