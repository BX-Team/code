name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.2.0)
        required: true
        type: string
      draft:
        description: Publish the release as a draft
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io
  OWNER: bx-team

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version and find the previous tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  lint:
    name: Lint (${{ matrix.name }})
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust
          - name: web
          - name: typos
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        if: matrix.name == 'rust'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - name: Restore the Cargo cache
        if: matrix.name == 'rust'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        if: matrix.name == 'rust'
        run: cargo fmt --all --check
      - name: Run clippy
        if: matrix.name == 'rust'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install Bun
        if: matrix.name == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        if: matrix.name == 'web'
        run: bun install --frozen-lockfile
      - name: Run Biome
        if: matrix.name == 'web'
        run: bunx biome ci .
      - name: Check spelling
        if: matrix.name == 'typos'
        uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce # master

  check:
    name: Check
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bx_team
          POSTGRES_PASSWORD: bx_team
          POSTGRES_DB: bx_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx_team"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bx_team:bx_team@127.0.0.1:5432/bx_team
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Type-check the workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Verify the lockfile is up to date
        run: cargo check --workspace --locked
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - name: Apply migrations
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx migrate run --source packages/database/migrations
      - name: Verify the offline query cache matches the schema
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx prepare --workspace --check -- --all-targets

  test:
    name: Test
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bx_team
          POSTGRES_PASSWORD: bx_team
          POSTGRES_DB: bx_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx_team"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bx_team:bx_team@127.0.0.1:5432/bx_team
      CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
      CLICKHOUSE_TEST_DATABASE: bx_team
      CLICKHOUSE_TEST_USER: default
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run the test suite
        run: cargo test --workspace --all-features

  tag:
    name: Tag
    needs: [prepare, lint, check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
      - name: Set the workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          cargo update --workspace --offline
        shell: bash
      - name: Commit the bump and push the tag
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: Build ${{ matrix.service }}
    needs: [prepare, tag]
    # Older glibc than the runtime image carries, so the binary keeps working there. Building on
    # a newer runner would link against symbols distroless/cc-debian12 does not have.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [azimuth, influx, cinder]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.service }}
      - name: Build the service binary
        # Set on the service build only: stamping it globally would invalidate the cached
        # dependency crates on every commit.
        run: BX_GIT_HASH=$(git rev-parse --short HEAD) cargo build --profile release-service --locked -p ${{ matrix.service }}
        shell: bash
      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.service }}
          path: target/release-service/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image ${{ matrix.service }}
    needs: [prepare, tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [azimuth, influx, cinder]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - name: Download the binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: binary-${{ matrix.service }}
          path: apps/${{ matrix.service }}/staging
      - name: Make the binary executable
        run: chmod +x apps/${{ matrix.service }}/staging/${{ matrix.service }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:latest
          provenance: false

  changelog:
    name: Changelog
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      body: ${{ steps.build.outputs.changelog }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the changelog
        id: build
        uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5
        with:
          configuration: .github/changelog_configuration.json
          mode: COMMIT
          fromTag: ${{ needs.prepare.outputs.previous }}
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: [prepare, tag, image, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          draft: ${{ inputs.draft }}

  summary:
    name: Summary
    if: always()
    needs: [prepare, lint, check, test, tag, build, image, changelog, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Report the outcome
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if printf '%s' "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::release $TAG did not complete"
            exit 1
          fi
          {
            echo "## $TAG released"
            echo
            echo 'The host picks the images up within 15 minutes via `podman-auto-update.timer`.'
            echo 'To roll it out now: `systemctl start podman-auto-update`.'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
