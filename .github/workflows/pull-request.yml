name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  labels:
    name: Label the pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Label the touched areas
        uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Label the kind of change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          type=$(printf '%s' "$TITLE" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
          scope=$(printf '%s' "$TITLE" | sed -nE 's/^[a-z]+\(([^)]*)\)!?:.*/\1/p')
          case "$type" in
            feat) label='🔧 enchantment' ;;
            fix) label='🐛 bug' ;;
            docs) label='📝 documentation' ;;
            perf) label='⚡ performance' ;;
            refactor) label='🧹 refactor' ;;
            *) label='' ;;
          esac
          case "$scope" in
            deps) label='🔄 dependencies' ;;
            security) label='🔒 security' ;;
          esac
          if [ -z "$label" ]; then
            echo "no label matches the title: $TITLE"
            exit 0
          fi
          gh pr edit "$NUMBER" --add-label "$label"
        shell: bash

  commits:
    name: Commit titles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the titles are Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style)(\([[:alnum:]_.-]+\))?!?: .+'
          status=0
          while IFS= read -r title; do
            case "$title" in
              "Merge "*) continue ;;
            esac
            if ! printf '%s' "$title" | grep -Eq "$pattern"; then
              echo "::error::commit title is not a Conventional Commit: $title"
              status=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $status
        shell: bash

  format:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lints with Biome
        run: bunx biome ci .

      - name: Check spelling
        uses: crate-ci/typos@v1

  rust:
    name: Rust workspace
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace --all-features --locked

      - name: Run the test suite
        run: cargo test --workspace --all-features --locked

  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install the web dependencies
        run: bun install --frozen-lockfile

      - name: Build the static site
        run: bun run build:meridian

  summary:
    name: Report the check result
    if: always()
    needs: [commits, format, rust, web]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the result to the run summary
        env:
          COMMITS: ${{ needs.commits.result }}
          FORMAT: ${{ needs.format.result }}
          RUST: ${{ needs.rust.result }}
          WEB: ${{ needs.web.result }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🚫' ;;
              *) printf '⏭️' ;;
            esac
          }
          {
            echo '## Checks'
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Commit titles | $(icon "$COMMITS") \`$COMMITS\` |"
            echo "| Formatting and spelling | $(icon "$FORMAT") \`$FORMAT\` |"
            echo "| Rust workspace | $(icon "$RUST") \`$RUST\` |"
            echo "| Web app | $(icon "$WEB") \`$WEB\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Fail if any stage did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
