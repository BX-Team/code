name: Test

on:
  workflow_call:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  DATABASE_URL: postgres://bx_team:bx_team@127.0.0.1:5432/bx_team
  CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
  CLICKHOUSE_TEST_DATABASE: bx_team
  CLICKHOUSE_TEST_USER: default

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bx_team
          POSTGRES_PASSWORD: bx_team
          POSTGRES_DB: bx_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx_team"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run the test suite
        run: cargo test --workspace --all-features
