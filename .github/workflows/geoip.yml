name: GeoIP Database Refresh

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: geoip
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh database
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Read the upstream checksum
        id: upstream
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -z "$IPINFO_TOKEN" ]; then
            echo "::error::IPINFO_TOKEN is not configured"
            exit 1
          fi
          sha256=$(curl --fail --silent --show-error --location \
            "https://ipinfo.io/data/ipinfo_lite.mmdb/checksums?token=$IPINFO_TOKEN" \
            | jq -er '.checksums.sha256')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "upstream sha256 is $sha256"
        shell: bash

      - name: Compare it with the published database
        id: published
        env:
          UPSTREAM: ${{ steps.upstream.outputs.sha256 }}
        run: |
          gh release download geoip --pattern SHA256SUMS --output published.txt || true
          current=$(awk '{ print $1 }' published.txt 2>/dev/null || true)
          if [ "$current" = "$UPSTREAM" ]; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
            echo "the published database already matches, nothing to do"
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
            echo "the published database is ${current:-missing}, refreshing"
          fi
        shell: bash

      - name: Download the IPinfo Lite database
        if: steps.published.outputs.up-to-date == 'false'
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          curl --fail --silent --show-error --location \
            -o ipinfo_lite.mmdb \
            "https://ipinfo.io/data/ipinfo_lite.mmdb?token=$IPINFO_TOKEN"
        shell: bash

      - name: Verify the download against the checksum
        if: steps.published.outputs.up-to-date == 'false'
        env:
          UPSTREAM: ${{ steps.upstream.outputs.sha256 }}
        run: |
          printf '%s  ipinfo_lite.mmdb\n' "$UPSTREAM" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
        shell: bash

      - name: Publish the rolling release
        if: steps.published.outputs.up-to-date == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: geoip
          name: GeoIP database
          body: IPinfo Lite, refreshed daily. Consumed by the host's `bx-geoip-update` timer.
          prerelease: true
          files: |
            ipinfo_lite.mmdb
            SHA256SUMS
